name: ZhentuAnnotation
options:
  # 必须锁！xcodegen 默认生成最新工程格式，runner 上的 Xcode 可能打不开（见技能 SKILL.md §2）
  xcodeVersion: "15.4"
  bundleIdPrefix: com.soranimi
  deploymentTarget:
    iOS: "18.0"
targets:
  ZhentuAnnotation:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
      - path: Web
        type: folder   # folder = 整目录原样进包，HTML 相对路径依赖目录结构
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: 真题批注
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIDeviceFamily: [1, 2]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortraitUpsideDown
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # iPadOS/iOS 26 缺 Scene 生命周期配置会启动即崩（SKILL.md §4.1）
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.soranimi.zhentu.annotation
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
